<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PING PONG ONLINE MULTIPLAYER</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="menu-screen" class="screen active">
        <h1 class="title">PING PONG<br>LAN MULTIPLAYER</h1>
        <button onclick="createGame()">Create Game</button>
        <button onclick="showJoinScreen()">Join Game</button>
    </div>

    <div id="join-screen" class="screen">
        <h2>Enter Room Code</h2>
        <input id="room-code-input" type="text" maxlength="4" placeholder="e.g. X4B9">
        <button onclick="joinGame()">Join</button>
        <button onclick="backToMenu()">Back</button>
    </div>

    <div id="waiting-screen" class="screen">
        <h2>Waiting for opponent...</h2>
        <p>Room Code: <span id="room-code-display" class="highlight"></span></p>
        <button onclick="backFromWaiting()">Back</button>
    </div>

    <div id="countdown-screen" class="screen">
        <div id="countdown-number" class="big-number"></div>
    </div>

    <div id="game-screen" class="screen">
        <canvas id="game-canvas" width="800" height="600"></canvas>
        
           <!-- Ready & Pause overlay -->
        <div id="ready-overlay" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); display:none; flex-direction:column; align-items:center; gap:20px; background:rgba(0,0,0,0.85); padding:30px 60px; border-radius:15px;">
           <h2 id="ready-text" style="margin:0; color:#0ff;">READY?</h2>
           <button onclick="playerReady()" style="font-size:1.8rem; padding:15px 50px;">I'M READY</button>
        </div>

        <button onclick="togglePause()" id="pause-btn" 
            style="position:absolute; top:20px; right:20px; font-size:1.1rem; padding:8px 20px; display:none;">
           ⏸ PAUSE
        </button>
     </div>

    <div id="game-over-screen" class="screen">
        <h1 id="winner-text"></h1>
        <button onclick="playAgain()">Play Again</button>
        <button onclick="exitToMenu()">Exit to Menu</button>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="/static/socket.js"></script>
    <script src="/static/menu.js"></script>
    <script src="/static/game.js"></script>
</body>
</html>
